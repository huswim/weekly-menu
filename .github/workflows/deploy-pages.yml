name: Update and deploy weekly menu

on:
  push:
    branches: [main]
  schedule:
    # 18:00 in Korea (09:00 UTC), daily, including delayed postings.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: '3.12'
      - name: Fetch and validate menu
        if: github.event_name != 'push'
        run: |
          python -m pip install pypdf==6.21.3
          python scripts/update-menu.py
      - name: Save new menu
        if: github.event_name != 'push'
        id: save
        run: |
          git add -A dist/weeks.json dist/assets
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update weekly menu'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Update PWA cache version
        if: github.event_name == 'push' || steps.save.outputs.changed == 'true'
        run: python3 build-pwa.py
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push' || steps.save.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push' || steps.save.outputs.changed == 'true'
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        if: github.event_name == 'push' || steps.save.outputs.changed == 'true'
        id: deployment
